name: Deploy staging

on:
  workflow_dispatch:
  push:
    branches:
      - staging

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: Gronn-Jobb/shared-workflows/.github/workflows/deploy-container-app.yml@staging
    with:
      environment: stg
      # The Dockerfile's last stage is a LibreOffice-only variant.
      docker-target: gotenberg
    secrets: inherit
