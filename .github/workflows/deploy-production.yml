name: Deploy production

on:
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: Gronn-Jobb/shared-workflows/.github/workflows/deploy-container-app.yml@master
    with:
      environment: prod
      # The Dockerfile's last stage is a LibreOffice-only variant.
      docker-target: gotenberg
    secrets: inherit
