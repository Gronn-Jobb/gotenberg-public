name: Deploy development

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: Gronn-Jobb/shared-workflows/.github/workflows/deploy-container-app.yml@develop
    with:
      environment: dev
      # The Dockerfile's last stage is a LibreOffice-only variant.
      docker-target: gotenberg
    secrets: inherit
